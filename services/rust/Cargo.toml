[workspace]
resolver = "2"
members = [
    "dispatcher",
    "worker",
    "crates/common",
]

[workspace.dependencies]
common = { path = "crates/common" }
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1"
uuid = { version = "1.29", features = ["v7", "serde"] }
postcard = { version = "1.1", features = ["alloc"] }
dashmap = "6.2"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"] }
