[workspace]
resolver = "2"
members = [
    "dispatcher",
    "worker",
    "crates/common",
]

[workspace.dependencies]
common = { path = "crates/common" }
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8" }
hyper = { version = "1.12", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_repr = "0.1"
uuid = { version = "1.29", features = ["v7", "serde"] }
postcard = { version = "1.1", features = ["alloc"] }
prost = "0.14"
zstd = "0.14"
dashmap = "6.2"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", features = ["grpc-tonic", "metrics", "trace"] }
