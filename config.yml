# GitHub
github_owner: vitalymind
github_repo: observelol

# Google  cloud APIs
gcp_required_apis:
  - iam.googleapis.com
  - iamcredentials.googleapis.com
  - storage.googleapis.com
  - compute.googleapis.com
  - artifactregistry.googleapis.com
  - sts.googleapis.com
  - cloudresourcemanager.googleapis.com

# Google cloud project
gcp_project_id: observelol
gcp_project_number: 734759595251
gcp_region: europe-north1

# Google envirinment
gcp_state_bucket_name: observelol-service-bucket
gcp_workload_identity_pool: github-pool
gcp_workload_identity_provider: github-provider
gcp_deploy_sa_name: github-deployer
gcp_vm_sa_name: worker-service

# Infrastructure definitions
infra_definitions:
  zone: a
  subnet: "observelol-subnet"
  ingest_vm:
    name: "ingest"
    type: e2-medium
    image: cos-cloud/cos-stable
    boot_disk:
      size: 10
      type: pd-balanced
  worker_vm:
    name: "worker"
    type: e2-small
    image: cos-cloud/cos-stable
    boot_disk:
      size: 10
      type: pd-balanced
  control_vm:
    name: "control"
    type: e2-medium
    image: cos-cloud/cos-stable
    boot_disk:
      size: 10
      type: pd-balanced
    attached_disk:
      name: db-storage
      size: 20
      type: pd-ssd

# Tooling & CI Versions
ci_versions:
  opentofu: "1.13.2"
  python: "3.13"

# Container Images
container_images:
  redis: "redis:7-alpine"
  nginx: "nginx:1.30-alpine"
  cadvisor: "ghcr.io/google/cadvisor:v0.60.2"
  otel_lgtm: "grafana/otel-lgtm:0.38.1"
  rust_builder: "rust:1.99-slim-bookworm"
  debian_runtime: "debian:bookworm-slim"

# Application & Ingest configuration
ingest_config:
  domain: "observelol.vbrokh.dev"
  redis_maxmemory: "1gb"
  redis_event_ttl_sec: 900
  game_end_grace_ms: 1000
  control_port: 3000
  otel_grpc_port: 4317
  otel_export_interval_ms: 5000
  otel_scrape_interval: "5s"

# Worker configuration
worker_config:
  replicas: 5
  db_mode: "drop" #postgres, drop
  redis_port: 6379
  batch_size: 16
  block_ms: 5000
  autoclaim_threshold_ms: 30000
  zstd_level: 3 #Replay compression
