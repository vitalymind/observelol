services:
  worker:
    image: ${WORKER_IMAGE}
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS}
    environment:
      REDIS_URL: "redis://${REDIS_HOST}:${REDIS_PORT}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://${CONTROL_HOST}:${OTEL_GRPC_PORT}"
      OTEL_METRIC_EXPORT_INTERVAL: "${OTEL_METRIC_EXPORT_INTERVAL}"
      DB_MODE: "${DB_MODE}"
      DATABASE_URL: "${DATABASE_URL:-}"
      WORKER_BATCH_SIZE: "${WORKER_BATCH_SIZE}"
      WORKER_BLOCK_MS: "${WORKER_BLOCK_MS}"
      WORKER_AUTOCLAIM_THRESHOLD_MS: "${WORKER_AUTOCLAIM_THRESHOLD_MS}"
      WORKER_ZSTD_LEVEL: "${WORKER_ZSTD_LEVEL}"

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: observelol-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    command:
      - "--housekeeping_interval=5s"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp,memory_numa"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
