worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    upstream dispatcher_backend {
        server unix:/var/run/dispatcher/dispatcher.sock;
        keepalive 64;
    }

    upstream control_backend {
        server ${CONTROL_HOST}:${CONTROL_PORT};
        keepalive 32;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name ${INGEST_DOMAIN};

        ssl_certificate     /etc/letsencrypt/live/${INGEST_DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${INGEST_DOMAIN}/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Producer & Health Endpoints -> Rust Dispatcher via Unix Socket
        location = /api/event/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://dispatcher_backend;
        }

        location = /api/new-game/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://dispatcher_backend;
        }

        location = /health {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://dispatcher_backend;
        }

        # All other traffic -> VM2 Control Plane (Next.js Admin UI & SSE)
        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_pass http://control_backend;
        }
    }
}
