worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  text/plain;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    access_log off;
    error_log  /var/log/nginx/error.log warn;

    # Future upstream when VM2 Control Plane (Next.js) is deployed:
    # upstream control_backend {
    #     server ${CONTROL_HOST}:${CONTROL_PORT};
    #     keepalive 32;
    # }

    server {
        listen 80;
        server_name ${INGEST_DOMAIN} _;

        location / {
            return 200 "ok\n";
        }
    }
}
