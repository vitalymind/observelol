# Network & Socket
bind 0.0.0.0
port 6379
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Local Unix Domain Socket for Rust Dispatcher on VM1
unixsocket /var/run/redis/redis.sock
unixsocketperm 777

# Pure In-Memory Mode (disable disk snapshots & AOF for maximum ingestion throughput)
save ""
appendonly no

# Memory Management (maxmemory value is injected via CLI flag from config.yml)
maxmemory-policy volatile-ttl
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
