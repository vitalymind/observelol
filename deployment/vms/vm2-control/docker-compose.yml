services:
  otel-lgtm:
    image: ${OTEL_LGTM_IMAGE}
    container_name: observelol-otel-lgtm
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "${OTEL_GRPC_PORT}:4317"
    environment:
      INGEST_HOST: "${INGEST_HOST}"
      CONTROL_HOST: "${CONTROL_HOST}"
      WORKER_HOST: "${WORKER_HOST}"
      OTEL_SCRAPE_INTERVAL: "${OTEL_SCRAPE_INTERVAL}"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/observelol.json"
    volumes:
      - ./otel-collector-config.yml:/otel-lgtm/otelcol-config.yaml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/observelol.json:ro

  cadvisor:
    image: ${CADVISOR_IMAGE}
    container_name: observelol-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "8080:8080"
    command:
      - "--housekeeping_interval=5s"
      - "--disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb,referenced_memory,cpu_topology,resctrl,process,advtcp,memory_numa"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
