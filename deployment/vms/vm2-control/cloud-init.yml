#cloud-config

write_files:
  - path: /etc/systemd/system/observelol.service
    permissions: "0644"
    owner: root
    content: |
      [Unit]
      Description=ObserveLoL Control Docker Compose Stack
      After=docker.service network-online.target
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      WorkingDirectory=/var/lib/observelol
      Environment="HOME=/home/chronos"
      # 1. Configure Artifact Registry auth for host Docker daemon
      ExecStartPre=/usr/bin/docker-credential-gcr configure-docker --registries=${region}-docker.pkg.dev
      # 2. Allow node-exporter (network_mode: host) through COS host firewall
      ExecStartPre=-/bin/sh -c '/sbin/iptables -w -C INPUT -p tcp --dport 9100 -j ACCEPT 2>/dev/null || /sbin/iptables -w -I INPUT -p tcp --dport 9100 -j ACCEPT'
      # 3. Run docker compose via official docker:cli image
      ExecStart=/usr/bin/docker run --rm \
        -v /var/run/docker.sock:/var/run/docker.sock \
        -v /var/lib/observelol:/var/lib/observelol \
        -w /var/lib/observelol \
        docker:cli compose up -d --remove-orphans

      [Install]
      WantedBy=multi-user.target

runcmd:
  - mkdir -p /var/lib/observelol
  - systemctl daemon-reload
  - systemctl enable observelol.service
