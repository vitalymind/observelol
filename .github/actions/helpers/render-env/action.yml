name: "Render .env File"
description: "Generates a .env file from config.yml paths and dynamic CI variables"

inputs:
  output_file:
    description: "Path to the .env file to generate"
    required: true
  mappings:
    description: "Newline-separated ENV_VAR=.yaml.path pairs resolved from config.yml"
    required: false
    default: ""
  vars:
    description: "Newline-separated literal ENV_VAR=value pairs (e.g. dynamic tags/IPs)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Render .env file
      shell: bash
      run: |
        CONFIG="$GITHUB_WORKSPACE/config.yml"
        OUT="$GITHUB_WORKSPACE/${{ inputs.output_file }}"
        : > "$OUT"

        # 1. Resolve YAML paths from config.yml
        while IFS= read -r line || [ -n "$line" ]; do
          line=$(echo "$line" | xargs)
          [ -z "$line" ] && continue
          var_name="${line%%=*}"
          yaml_path="${line#*=}"
          val=$(yq -e "$yaml_path" "$CONFIG")
          echo "${var_name}=${val}" >> "$OUT"
        done <<< "${{ inputs.mappings }}"

        # 2. Append dynamic/literal variables
        while IFS= read -r line || [ -n "$line" ]; do
          line=$(echo "$line" | xargs)
          [ -z "$line" ] && continue
          echo "$line" >> "$OUT"
        done <<< "${{ inputs.vars }}"
