name: "Ingest Verify"
description: "Runs formatting, clippy, unit tests for Rust services, and verifies poller scripts/build"

runs:
  using: "composite"
  steps:
    - name: Load config variables
      uses: ./.github/actions/helpers/load-config
      with:
        mappings: |
          POLLER_BASE=.container_images.poller_base

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: "services/rust -> target"

    - name: Check formatting
      shell: bash
      working-directory: services/rust
      run: cargo fmt --all -- --check

    - name: Run Clippy lints
      shell: bash
      working-directory: services/rust
      run: cargo clippy --package common --package dispatcher --all-targets -- -D warnings

    - name: Run unit tests
      shell: bash
      working-directory: services/rust
      run: cargo test --package common --package dispatcher

    - name: Check poller shell script syntax
      shell: bash
      run: sh -n deployment/vms/vm1-ingest/poller/poll.sh

    - name: Test build poller Docker image
      shell: bash
      run: docker build --build-arg BASE_IMAGE="$POLLER_BASE" deployment/vms/vm1-ingest/poller
