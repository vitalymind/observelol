name: "Ingest Build and Deploy"
description: "Builds Dispatcher image, pushes to Artifact Registry, and deploys configs to VM1"

inputs:
  vm2_internal_ip:
    description: "Internal VPC IP of VM2 (control) from OpenTofu output"
    required: true
  artifact_registry_url:
    description: "Artifact Registry base URL from OpenTofu output"
    required: true

runs:
  using: "composite"
  steps:
    - name: Load config variables
      uses: ./.github/actions/helpers/load-config
      with:
        mappings: |
          RUST_BUILDER=.container_images.rust_builder
          DEBIAN_RUNTIME=.container_images.debian_runtime
          REGION=.GCP_REGION
          ZONE=.infra_definitions.zone
          VM_NAME=.infra_definitions.ingest_vm.name
          STATE_BUCKET=.GCP_STATE_BUCKET_NAME
          INGEST_DOMAIN=.ingest_config.domain

    - name: Load GCP OIDC configuration from config.yml
      uses: ./.github/actions/helpers/load-oidc-config

    - name: Authenticate to Google Cloud (OIDC)
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

    - name: Configure Docker for Artifact Registry
      shell: bash
      run: |
        gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

    - name: Build and push Dispatcher image to Artifact Registry
      shell: bash
      run: |
        docker build \
          --build-arg RUST_BUILDER_IMAGE="$RUST_BUILDER" \
          --build-arg DEBIAN_RUNTIME_IMAGE="$DEBIAN_RUNTIME" \
          -f services/rust/dispatcher/Dockerfile \
          -t "${{ inputs.artifact_registry_url }}/dispatcher:${GITHUB_SHA}" \
          -t "${{ inputs.artifact_registry_url }}/dispatcher:latest" \
          services/rust
        docker push "${{ inputs.artifact_registry_url }}/dispatcher:${GITHUB_SHA}"
        docker push "${{ inputs.artifact_registry_url }}/dispatcher:latest"

    - name: Wait for VM1 SSH and cloud-init to be ready
      shell: bash
      run: |
        for i in {1..24}; do
          if gcloud compute ssh "${VM_NAME}" \
            --zone="${REGION}-${ZONE}" \
            --tunnel-through-iap \
            --command="cloud-init status --wait && mkdir -p /tmp/observelol" 2>/dev/null; then
            exit 0
          fi
          echo "Waiting for VM1 SSH / cloud-init... ($i/24)"
          sleep 5
        done
        echo "Error: VM1 did not become ready in time."
        exit 1

    - name: Render .env on runner
      uses: ./.github/actions/helpers/render-env
      with:
        output_file: deployment/vms/vm1-ingest/.env
        mappings: |
          REDIS_IMAGE=.container_images.redis
          NGINX_IMAGE=.container_images.nginx
          NODE_EXPORTER_IMAGE=.container_images.node_exporter
          REDIS_MAXMEMORY=.ingest_config.redis_maxmemory
          INGEST_DOMAIN=.ingest_config.domain
          CONTROL_PORT=.ingest_config.control_port
          OTEL_GRPC_PORT=.ingest_config.otel_grpc_port
          REDIS_EVENT_TTL_SEC=.ingest_config.redis_event_ttl_sec
          GAME_END_GRACE_MS=.ingest_config.game_end_grace_ms
        vars: |
          DISPATCHER_IMAGE=${{ inputs.artifact_registry_url }}/dispatcher:${{ github.sha }}
          CONTROL_HOST=${{ inputs.vm2_internal_ip }}

    - name: Download TLS certificates from GCS
      shell: bash
      run: |
        mkdir -p deployment/vms/vm1-ingest/certs
        gcloud storage cp "gs://${STATE_BUCKET}/certs/${INGEST_DOMAIN}/*" deployment/vms/vm1-ingest/certs/

    - name: Copy VM1 folder to VM1
      shell: bash
      run: |
        shopt -s dotglob
        gcloud compute scp --recurse \
          deployment/vms/vm1-ingest/* \
          "${VM_NAME}:/tmp/observelol/" \
          --zone="${REGION}-${ZONE}" \
          --tunnel-through-iap

    - name: Apply Docker Compose on VM1
      shell: bash
      run: |
        gcloud compute ssh "${VM_NAME}" \
          --zone="${REGION}-${ZONE}" \
          --tunnel-through-iap \
          --command="sudo mkdir -p /var/lib/observelol && sudo cp -r /tmp/observelol/. /var/lib/observelol/ && sudo rm -rf /tmp/observelol && sudo systemctl start observelol.service"
