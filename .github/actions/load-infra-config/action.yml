name: "Load Configuration"
description: "Reads config.yml using yq and exports OpenTofu and OIDC variables to $GITHUB_ENV"

runs:
  using: "composite"
  steps:
    - name: Parse config.yml and export to $GITHUB_ENV
      shell: bash
      run: |
        CONFIG="$GITHUB_WORKSPACE/config.yml"

        PROJECT_ID=$(yq '.GCP_PROJECT_ID' "$CONFIG")
        PROJECT_NUMBER=$(yq '.GCP_PROJECT_NUMBER' "$CONFIG")
        POOL=$(yq '.GCP_WORKLOAD_IDENTITY_POOL' "$CONFIG")
        PROVIDER=$(yq '.GCP_WORKLOAD_IDENTITY_PROVIDER' "$CONFIG")
        DEPLOY_SA=$(yq '.GCP_DEPLOY_SA_NAME' "$CONFIG")

        # Assemble OIDC credentials
        echo "GCP_WORKLOAD_IDENTITY_PROVIDER=projects/$PROJECT_NUMBER/locations/global/workloadIdentityPools/$POOL/providers/$PROVIDER" >> "$GITHUB_ENV"
        echo "GCP_SERVICE_ACCOUNT=$DEPLOY_SA@$PROJECT_ID.iam.gserviceaccount.com" >> "$GITHUB_ENV"