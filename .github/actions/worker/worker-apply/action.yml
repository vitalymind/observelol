name: "Worker Apply"
description: "Renders .env, copies files to target Worker VM, and restarts observelol.service"

inputs:
  vm_name:
    description: "Name of target GCE VM"
    required: true
  worker_image:
    description: "Full Docker image path and tag for Worker"
    required: true
  redis_host:
    description: "Redis host IP (VM1 internal IP for prod)"
    required: true
  control_host:
    description: "Control plane host IP (VM2 internal IP for prod, 127.0.0.1 for test)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Load config variables
      uses: ./.github/actions/helpers/load-config
      with:
        mappings: |
          REGION=.GCP_REGION
          ZONE=.infra_definitions.zone

    - name: Render .env on runner
      uses: ./.github/actions/helpers/render-env
      with:
        output_file: deployment/vms/vm3-worker/.env
        mappings: |
          NODE_EXPORTER_IMAGE=.container_images.node_exporter
          OTEL_GRPC_PORT=.ingest_config.otel_grpc_port
          WORKER_REPLICAS=.worker_config.replicas
          DB_MODE=.worker_config.db_mode
          REDIS_PORT=.worker_config.redis_port
          WORKER_BATCH_SIZE=.worker_config.batch_size
          WORKER_BLOCK_MS=.worker_config.block_ms
          WORKER_AUTOCLAIM_THRESHOLD_MS=.worker_config.autoclaim_threshold_ms
          WORKER_ZSTD_LEVEL=.worker_config.zstd_level
        vars: |
          WORKER_IMAGE=${{ inputs.worker_image }}
          REDIS_HOST=${{ inputs.redis_host }}
          CONTROL_HOST=${{ inputs.control_host }}

    - name: Copy files to VM
      shell: bash
      run: |
        gcloud compute ssh "${{ inputs.vm_name }}" \
          --zone="${REGION}-${ZONE}" \
          --tunnel-through-iap \
          --command="mkdir -p /tmp/observelol"
        shopt -s dotglob
        gcloud compute scp --recurse \
          deployment/vms/vm3-worker/* \
          "${{ inputs.vm_name }}:/tmp/observelol/" \
          --zone="${REGION}-${ZONE}" \
          --tunnel-through-iap

    - name: Apply Docker Compose on VM
      shell: bash
      run: |
        gcloud compute ssh "${{ inputs.vm_name }}" \
          --zone="${REGION}-${ZONE}" \
          --tunnel-through-iap \
          --command="sudo mkdir -p /var/lib/observelol && sudo cp -r /tmp/observelol/. /var/lib/observelol/ && sudo rm -rf /tmp/observelol && sudo systemctl restart observelol.service"
