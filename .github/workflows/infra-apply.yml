name: Infrastructure Apply

on:
  push:
    branches: [ main ]
    paths:
      - 'deployment/infra/**'
      - 'config.yml'

concurrency:
  group: infra-apply-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Load configuration from config.yml
        uses: ./.github/actions/load-infra-config

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13"

      - name: Initialize OpenTofu (GCS Backend)
        run: tofu init

      - name: Apply changes to GCP
        run: tofu apply -auto-approve
