name: Infrastructure Apply

on:
  push:
    branches: [ main ]
    paths:
      - 'deployment/infra/**'

# Queue deployments sequentially; never cancel an active deployment mid-apply
concurrency:
  group: infra-apply-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/infra
    env:
      TF_VAR_project_id: "${{ vars.GCP_PROJECT_ID }}"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ vars.GCP_SERVICE_ACCOUNT }}"

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.13"

      - name: Initialize OpenTofu (GCS Backend)
        run: tofu init

      - name: Apply changes to GCP
        run: tofu apply -auto-approve
