name: Production Deploy Orchestrator

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  id-token: write

jobs:
  # TESTING (on pr)
  upload-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload config file
        uses: ./.github/actions/helpers/upload-config

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Python Checks
        uses: ./.github/actions/python/python-format

  ingest-verify-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ingest Rust Verify
        uses: ./.github/actions/ingest/ingest-verify-rust

  ingest-verify-vm:
    needs: [ingest-verify-rust]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Builds image, provision test VM and runs deploy
        uses: ./.github/actions/ingest/ingest-verify-vm

  worker-verify-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Worker Rust Verify
        uses: ./.github/actions/worker/worker-verify-rust

  worker-verify-vm:
    needs: [worker-verify-rust]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Builds worker image, provisions test VM and runs deploy
        uses: ./.github/actions/worker/worker-verify-vm

  control-verify-vm:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Provisions test Control VM and verifies telemetry stack
        uses: ./.github/actions/control/control-verify-vm

  infra-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Infrastructure Plan
        uses: ./.github/actions/infra/infra-plan
  
  # DEPLOYMENT (on push)
  infra-apply:
    needs: [python, ingest-verify-rust, worker-verify-rust, infra-plan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      vm1_internal_ip: ${{ steps.infra-apply.outputs.vm1_internal_ip }}
      vm2_internal_ip: ${{ steps.infra-apply.outputs.vm2_internal_ip }}
      vm3_internal_ip: ${{ steps.infra-apply.outputs.vm3_internal_ip }}
      artifact_registry_url: ${{ steps.infra-apply.outputs.artifact_registry_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Infrastructure Apply
        id: infra-apply
        uses: ./.github/actions/infra/infra-apply

  ingest-deploy:
    needs: infra-apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Ingest Build and Deploy
        uses: ./.github/actions/ingest/ingest-deploy
        with:
          vm2_internal_ip: ${{ needs.infra-apply.outputs.vm2_internal_ip }}
          artifact_registry_url: ${{ needs.infra-apply.outputs.artifact_registry_url }}

  worker-deploy:
    needs: infra-apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Worker Build and Deploy
        uses: ./.github/actions/worker/worker-deploy
        with:
          vm1_internal_ip: ${{ needs.infra-apply.outputs.vm1_internal_ip }}
          vm2_internal_ip: ${{ needs.infra-apply.outputs.vm2_internal_ip }}
          artifact_registry_url: ${{ needs.infra-apply.outputs.artifact_registry_url }}

  control-deploy:
    needs: infra-apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Control Deploy
        uses: ./.github/actions/control/control-deploy
        with:
          vm1_internal_ip: ${{ needs.infra-apply.outputs.vm1_internal_ip }}
          vm2_internal_ip: ${{ needs.infra-apply.outputs.vm2_internal_ip }}
          vm3_internal_ip: ${{ needs.infra-apply.outputs.vm3_internal_ip }}
